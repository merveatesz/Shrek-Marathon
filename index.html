<!DOCTYPE html>
<html lang="de">
    <head>
        <meta charset="UTF-8">
        <meta name ="viewport" content="width=device-width, initial-scale=1.0">
        <script src="main.js" defer></script>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <h1>Shrek Sitzungsplätze</h1>
        <p>Bitte suche Dir einen Sitzplatz aus.</p>
        <p>Schwulian Maria Tatütata</p>
        <label for="email">E-Mail-Adresse:</label>
        <input type="email" placeholder="E-Mail-Adresse">
        <button type="submit">Absenden</button>
        <h2>Verfügbare Sitzplätze</h2>
        <div class="sitzplatz-container">
            <button class="sitzplatz sitzkissen1-sofaLinks" type="button" onclick="sitzKlicken(this)" aria-pressed="false">
                <img src="Plätze/sitzkissen.png" alt="Platz 1: Shrek" width="300">
                <span>Platz 1 SofaLinks</span>
            </button>
            <button class="sitzplatz sitzkissen2-sofaRechts" type="button" onclick="sitzKlicken(this)" aria-pressed="false">
                <img src="Plätze/sitzkissen2.png" alt="Platz 2: Fiona" width="300">
                <span>Stuhl</span>
            </button>
            <button class="sitzplatz sitzplatz3-sessel" type="button" onclick="sitzKlicken(this)" aria-pressed="false">
                <img src="Plätze/sitzkissen3.png" alt="Platz 3: Kater" width="300">
                <span>Sofa rechts</span>
            </button>
            <button class="sitzplatz sitzplatz4-stuhl" type="button" onclick="sitzKlicken(this)" aria-pressed="false">
                <img src="Plätze/sitzkissen4.png" alt="Platz 4: Prince" width="300">
                <span>Matratze</span>
            </button>
            <button class="sitzplatz sitzplatz5-matratze" type="button" onclick="sitzKlicken(this)" aria-pressed="false">
                <img src="Plätze/sitzkissen5.png" alt="Platz 5: Esel" width="300">
                <span>Platz 5 Sessel</span>
            </button>
        </div>
        <button class="reservieren" type="button" onclick="reservieren()">
            <span>Reservieren</span>
        </button>
    </body>
</html>
